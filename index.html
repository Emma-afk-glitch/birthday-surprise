<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A special birthday surprise for our beloved twins!">
  <title>Happy Birthday</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ========== MUTE / UNMUTE BUTTON ========== -->
  <button id="btn-mute" class="btn-mute" aria-label="Mute sounds">🔊</button>

  <!-- ========== FLOATING ICONS CONTAINER ========== -->
  <div id="floating-icons" class="floating-icons"></div>

  <!-- ========== CONFETTI CANVAS ========== -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ========== SCREEN 1: GENDER SELECTION ========== -->
  <section id="screen-select" class="screen active">
    <div class="select-container">
      <h1 class="select-title">
        <span class="emoji-bounce">🎉</span>
        Happy Birthday...?
        <span class="emoji-bounce delay">🎈</span>
      </h1>
      <p class="select-subtitle">Are you a...?</p>
      <div class="select-cards">
        <button id="btn-boy" class="select-card card-boy" aria-label="Select Boy">
          <!-- <div class="card-icon">👦</div> -->
          <div class="card-label">Male</div>
          <div class="card-hint">The Birthday Boy</div>
        </button>
        <button id="btn-girl" class="select-card card-girl" aria-label="Select Girl">
          <!-- <div class="card-icon">👧</div> -->
          <div class="card-label">Female</div>
          <div class="card-hint">The Birthday Girl</div>
        </button>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN 2: QUESTIONS ========== -->
  <section id="screen-questions" class="screen">
    <div class="questions-container">
      <div class="question-progress">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" class="progress-text">1 / 3</span>
      </div>
      <div id="question-card" class="question-card">
        <div id="question-emoji" class="question-emoji">🎂</div>
        <h2 id="question-text" class="question-text">Loading...</h2>
        <div class="question-buttons">
          <button id="btn-yes" class="btn-answer btn-yes">Yes</button>
          <button id="btn-no" class="btn-answer btn-no">No</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN 3: REVEAL / COLLAGE ========== -->
  <section id="screen-reveal" class="screen">
    <div class="reveal-container">
      <h1 id="reveal-title" class="reveal-title">Happy Birthday!</h1>
      <p id="reveal-subtitle" class="reveal-subtitle">Swipe through these memories</p>

      <div id="collage-wrapper" class="collage-wrapper">
        <div id="collage-track" class="collage-track">
          <!-- Slides injected by JS -->
        </div>
        <div class="collage-dots" id="collage-dots"></div>
        <button id="collage-prev" class="collage-nav collage-prev" aria-label="Previous">‹</button>
        <button id="collage-next" class="collage-nav collage-next" aria-label="Next">›</button>
      </div>

      <button id="btn-switch" class="btn-switch">
        Celebrate the Other Twin!
      </button>
      <button id="btn-restart" class="btn-restart">Start Over</button>
    </div>
  </section>

  <script src="js/sounds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
