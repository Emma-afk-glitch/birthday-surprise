<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- Cake base -->
  <rect x="30" y="68" width="68" height="28" rx="6" fill="#fff" opacity="0.95"/>
  <!-- Cake middle layer -->
  <rect x="36" y="54" width="56" height="18" rx="5" fill="#ffe066"/>
  <!-- Frosting drips -->
  <ellipse cx="64" cy="55" rx="30" ry="5" fill="#ff8fab"/>
  <!-- Candle 1 -->
  <rect x="44" y="38" width="5" height="18" rx="2" fill="#60a5fa"/>
  <!-- Flame 1 -->
  <ellipse cx="46.5" cy="36" rx="3.5" ry="5" fill="#fbbf24"/>
  <ellipse cx="46.5" cy="35" rx="2" ry="3" fill="#fff7ed"/>
  <!-- Candle 2 -->
  <rect x="61" y="34" width="5" height="22" rx="2" fill="#f472b6"/>
  <!-- Flame 2 -->
  <ellipse cx="63.5" cy="32" rx="3.5" ry="5" fill="#fbbf24"/>
  <ellipse cx="63.5" cy="31" rx="2" ry="3" fill="#fff7ed"/>
  <!-- Candle 3 -->
  <rect x="78" y="38" width="5" height="18" rx="2" fill="#34d399"/>
  <!-- Flame 3 -->
  <ellipse cx="80.5" cy="36" rx="3.5" ry="5" fill="#fbbf24"/>
  <ellipse cx="80.5" cy="35" rx="2" ry="3" fill="#fff7ed"/>
  <!-- Sparkle stars -->
  <text x="20" y="35" font-size="12" fill="#fff" opacity="0.9">✦</text>
  <text x="100" y="42" font-size="10" fill="#fff" opacity="0.8">✦</text>
  <text x="15" y="80" font-size="8" fill="#fff" opacity="0.7">✦</text>
  <text x="108" y="78" font-size="9" fill="#fff" opacity="0.85">✦</text>
</svg>
